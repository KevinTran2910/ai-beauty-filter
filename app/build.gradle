plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aibeauty.beautyfilter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aibeauty.beautyfilter'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // Face detection (mars-face-kit) ships arm64-v8a + armeabi-v7a only.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // Build libbeautyfilter.so from source via the repo's root CMakeLists,
        // so Android Studio (with NDK + CMake installed via SDK Manager) builds
        // everything in one click — no need to run script/build_android.sh.
        externalNativeBuild {
            cmake {
                arguments '-DGPUPIXEL_BUILD_SHARED_LIBS=ON',
                          '-DGPUPIXEL_ENABLE_FACE_DETECTOR=ON',
                          '-DGPUPIXEL_BUILD_DESKTOP_DEMO=OFF',
                          '-DANDROID_STL=c++_static'
                targets 'beautyfilter'
            }
        }
    }

    // libmars-face-kit.so is a prebuilt dependency (not built from source);
    // ship it from third_party. libbeautyfilter.so comes from externalNativeBuild.
    sourceSets {
        main {
            jniLibs.srcDirs += ['../../third_party/mars-face-kit/libs/android']
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Android 15+/16 require uncompressed, 16KB-aligned native libs in the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // CameraX — live preview frames fed into the native pipeline.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
}
